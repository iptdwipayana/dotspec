[workspace]
resolver = "3"
members  = [
    "dotspec-codegen",
    "dotspec-core",
    "dotspec-macro"
]

[workspace.package]
rust-version    = "1.85.0"
version         = "0.1.0"
edition         = "2024"
license         = "MIT OR Apache-2.0"
readme          = "README.md"
repository      = "https://github.com/iptdwipayana/dotspec"
homepage        = "https://github.com/iptdwipayana/dotspec"
documentation   = "https://docs.rs/dotspec"
authors         = ["Dwi Payana <iptdwipayana@gmail.com>"]
categories      = ["config", "parser"]
keywords        = ["config", "parser", "spec", "dotspec"]
publish         = false

[workspace.dependencies]
dotspec-codegen = { path = "dotspec-codegen", version = "0.1.0" }
dotspec-core    = { path = "dotspec-core", version = "0.1.0" }
dotspec-macro   = { path = "dotspec-macro", version = "0.1.0" }

[package]
name                    = "dotspec"
description             = "config parser for .spec files"
rust-version.workspace  = true
version.workspace       = true
edition.workspace       = true
license.workspace       = true
readme.workspace        = true
repository.workspace    = true
homepage.workspace      = true
documentation.workspace = true
authors.workspace       = true
categories.workspace    = true
keywords.workspace      = true
publish.workspace       = true

[dependencies]
dotspec-core.workspace  = true
dotspec-macro.workspace = true